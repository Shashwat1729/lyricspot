name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-core.txt
      # Tests mock Whisper, so CI installs the text-search core only
      # (fast, no torch). Voice deps are covered by the Docker image.
      - name: Install dependencies
        run: pip install -r requirements-core.txt pytest==7.4.4 httpx==0.25.2 ruff
      - name: Lint (ruff)
        run: ruff check . --select E,F,W --ignore E501
      - name: Tests
        run: python -m pytest tests/test_core.py tests/test_api.py tests/test_reliability.py tests/test_ranking.py tests/test_comprehensive_eval.py tests/test_pipeline.py tests/test_melody.py -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Scoring harness (shipped browser engine code)
        run: npm run test:unit
      - name: Build (static export)
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (mocked network)
        run: npm run test:e2e
        env:
          CI: 'true'
