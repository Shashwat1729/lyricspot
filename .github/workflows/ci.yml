name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        working-directory: backend
        run: |
          # openai-whisper ships as sdist with a legacy setup.py that needs
          # pkg_resources (removed in setuptools>=81); pin the build toolchain
          # and build without isolation so the pinned setuptools is used.
          pip install "setuptools<81" wheel
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt --no-build-isolation
      - name: Lint (ruff)
        working-directory: backend
        run: |
          pip install ruff
          ruff check . --select E,F,W --ignore E501
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/test_core.py tests/test_api.py tests/test_reliability.py tests/test_ranking.py tests/test_comprehensive_eval.py -v

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Frontend behavior harness (54 assertions on shipped scoring code)
        working-directory: frontend
        run: node verify-browsersearch.cjs
      - name: Build
        working-directory: frontend
        run: npm run build
