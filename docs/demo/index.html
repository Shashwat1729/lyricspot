<html><head><title>ContinueMySong Demo</title>
<style>
body{margin:0;background:#000;color:#fff;font-family:system-ui;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:40px 20px}
h1{margin-bottom:8px;font-size:28px}
.sub{color:#6b7280;margin-bottom:24px;font-size:14px}
.demo-img{width:100%;max-width:800px;border-radius:12px;border:1px solid rgba(255,255,255,0.1);box-shadow:0 8px 40px rgba(0,0,0,0.5)}
.label{text-align:center;margin:16px 0 20px;color:#9ca3af;font-size:14px;min-height:20px}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{padding:10px 24px;border-radius:8px;border:1px solid #333;background:#111;color:#e5e7eb;cursor:pointer;font-size:14px;transition:all 0.2s;text-decoration:none}
.btn:hover{background:#1DB954;color:#000;border-color:#1DB954}
.btn:disabled{opacity:0.3;cursor:default}
.counter{color:#6b7280;font-size:13px;min-width:60px;text-align:center}
.progress{display:flex;gap:6px;margin-bottom:24px}
.dot{width:10px;height:10px;border-radius:50%;background:#333;transition:all 0.3s}
.dot.active{background:#1DB954;box-shadow:0 0 8px rgba(29,185,84,0.5)}
</style></head><body>
<h1>🎬 ContinueMySong Demo</h1>
<p class="sub">A quick walkthrough of the app</p>
<div class="progress" id="progress"></div>
<img id="demoImg" class="demo-img" src="frame_01_voice.png" alt="Demo">
<p id="label" class="label">1 / 6: Tap the mic to start singing</p>
<div class="controls">
  <button class="btn" id="prevBtn">← Previous</button>
  <span class="counter" id="counter">1 / 6</span>
  <button class="btn" id="nextBtn">Next →</button>
</div>
<p style="margin-top:24px;color:#4b5563;font-size:12px">
  Tip: Use ← → arrow keys to navigate
</p>
<script>
const frames = [
  { src:"frame_01_voice.png", label:"Voice mode - tap the mic to start singing" },
  { src:"frame_02_lyrics.png", label:"Switch to Lyrics tab for text input" },
  { src:"frame_03_text.png", label:"Type the lyrics you remember" },
  { src:"frame_04_loading.png", label:"AI searches across YouTube, Genius, iTunes..." },
  { src:"frame_05_results.png", label:"Found! See song, artist, confidence & timestamp" },
  { src:"frame_06_scroll.png", label:"Open in Spotify at the exact moment" }
];
let cur = 0;
const img = document.getElementById("demoImg");
const lbl = document.getElementById("label");
const cnt = document.getElementById("counter");
const prog = document.getElementById("progress");
frames.forEach((_,i) => { const d = document.createElement("div"); d.className = "dot" + (i===0?" active":""); prog.appendChild(d); });
function go(n) { cur = (n + frames.length) % frames.length; update(); }
function update() {
  img.src = frames[cur].src;
  lbl.textContent = (cur+1) + "/6: " + frames[cur].label;
  cnt.textContent = (cur+1) + " / 6";
  document.querySelectorAll(".dot").forEach((d,i) => d.className = "dot" + (i===cur?" active":""));
}
document.getElementById("prevBtn").onclick = () => go(cur-1);
document.getElementById("nextBtn").onclick = () => go(cur+1);
document.addEventListener("keydown", e => { if(e.key==="ArrowRight") go(cur+1); if(e.key==="ArrowLeft") go(cur-1); });
</script></body></html>
